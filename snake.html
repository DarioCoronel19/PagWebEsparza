<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Snake | TechNova</title><link rel="stylesheet" href="css/styles.css">
<style>
.snake{padding:45px 0 70px;text-align:center}.snake h1{font-size:clamp(2.8rem,7vw,5rem);margin-bottom:8px}
.info{color:var(--muted);margin-bottom:18px}.hud{display:flex;justify-content:center;gap:16px;margin:18px 0}
.stat{background:var(--panel);border:1px solid #20334d;border-radius:12px;padding:10px 20px}.stat strong{color:var(--accent)}
canvas{display:block;width:min(92vw,520px);height:auto;margin:auto;background:#050b13;border:2px solid #29435f;border-radius:14px}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}.controls button,.pad button{border:1px solid #34506d;background:#12243a;color:var(--text);border-radius:10px;padding:12px 18px;cursor:pointer;font:inherit}
#msg{min-height:30px;margin-top:14px;color:var(--accent);font-weight:700}.pad{display:grid;grid-template-columns:repeat(3,55px);justify-content:center;gap:7px;margin:16px auto}.pad button{width:55px;height:48px;padding:0;font-size:1.2rem}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
</style></head>
<body>
<nav class="navbar container nav-page"><a class="logo" href="index.html">Tech<span>Nova</span></a><a class="back" href="videojuegos.html">← Videojuegos</a></nav>
<main class="container snake"><p class="eyebrow">TECHNOVA ARCADE</p><h1>🐍 Snake</h1>
<p class="info">Usa las flechas o WASD. Come la comida y evita chocar con las paredes o contigo mismo.</p>
<div class="hud"><div class="stat">Puntos<br><strong id="score">0</strong></div><div class="stat">Récord<br><strong id="best">0</strong></div></div>
<canvas id="game" width="520" height="520"></canvas><div id="msg">Presiona Iniciar para jugar</div>
<div class="controls"><button id="start" type="button">▶ Iniciar / Reiniciar</button><a class="btn" style="margin-top:0" href="videojuegos.html">← Volver</a></div>
<div class="pad"><button class="up" data-d="u">↑</button><button class="left" data-d="l">←</button><button class="down" data-d="d">↓</button><button class="right" data-d="r">→</button></div>
</main>
<script>
const c=document.getElementById("game"),x=c.getContext("2d"),S=document.getElementById("score"),B=document.getElementById("best"),M=document.getElementById("msg");
const g=20,n=c.width/g;let s,f,dx,dy,nx,ny,score=0,best=0,timer,running=false;
function food(){let p;do{p={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}while(s.some(q=>q.x===p.x&&q.y===p.y));return p}
function draw(){x.fillStyle="#050b13";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#0d1a28";for(let i=0;i<=c.width;i+=g){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(c.width,i);x.stroke()}x.fillStyle="#ff647c";x.beginPath();x.arc(f.x*g+g/2,f.y*g+g/2,g*.38,0,Math.PI*2);x.fill();s.forEach((p,i)=>{x.fillStyle=i?"#8d7cff":"#58d5ff";x.fillRect(p.x*g+2,p.y*g+2,g-4,g-4)})}
function start(){clearInterval(timer);s=[{x:13,y:13},{x:12,y:13},{x:11,y:13}];dx=nx=1;dy=ny=0;score=0;S.textContent=0;f=food();running=true;M.textContent="¡Jugando!";draw();timer=setInterval(tick,105)}
function tick(){dx=nx;dy=ny;let h={x:s[0].x+dx,y:s[0].y+dy};if(h.x<0||h.x>=n||h.y<0||h.y>=n||s.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);running=false;M.textContent="💥 Game Over — pulsa Iniciar / Reiniciar";return}s.unshift(h);if(h.x===f.x&&h.y===f.y){score++;S.textContent=score;if(score>best){best=score;B.textContent=best}f=food()}else s.pop();draw()}
function dir(d){if(!running)return;if(d==="u"&&dy!==1){nx=0;ny=-1}if(d==="d"&&dy!==-1){nx=0;ny=1}if(d==="l"&&dx!==1){nx=-1;ny=0}if(d==="r"&&dx!==-1){nx=1;ny=0}}
document.getElementById("start").addEventListener("click",start);document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>dir(b.dataset.d)));
document.addEventListener("keydown",e=>{let k=e.key.toLowerCase(),m={arrowup:"u",w:"u",arrowdown:"d",s:"d",arrowleft:"l",a:"l",arrowright:"r",d:"r"};if(m[k]){e.preventDefault();dir(m[k])}});
s=[{x:13,y:13},{x:12,y:13},{x:11,y:13}];f={x:18,y:13};draw();
</script></body></html>
